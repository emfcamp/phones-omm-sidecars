[project]
name = "omm-sidecars"
version = "0.1.0"
description = "Sidecar services for the OpenMobility® Manager (OMM)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mitel-ommclient2",
    "prometheus-client",
    "starlette>=1.3.1",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omm_sidecars"]

[tool.uv.sources]
mitel-ommclient2 = { path = "mitel_ommclient2", editable = true }

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "pytest-asyncio",
    "pytest-timeout>=2.4.0",
    "pytest",
    "python-dotenv",
    "ruff>=0.15.16",
]

[project.scripts]
dect-monitor = "omm_sidecars.dect_monitor:main"
dect-users = "omm_sidecars.dect_users:main"
dect-fun = "omm_sidecars.dect_fun:main"

[tool.pytest.ini_options]
timeout = 10

[tool.basedpyright]
typeCheckingMode = "strict"
stubPath = "typings"
exclude = ["**/tests/**", "**/.venv/**", "typings"]

[tool.ruff]
exclude = ["typings", "**/.venv/**"]
