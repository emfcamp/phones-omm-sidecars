[project]
name = "omm-sidecars"
version = "0.1.0"
description = "Sidecar services for the OpenMobility® Manager (OMM)"
requires-python = ">=3.11"
dependencies = [
    "mitel-ommclient2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "python-dotenv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
mitel-ommclient2 = { path = "mitel_ommclient2", editable = true }

[project.scripts]
dect-users = "omm_sidecars.dect_users:main"
