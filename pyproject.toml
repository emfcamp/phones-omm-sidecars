[project]
name = "omm-sidecars"
version = "0.1.0"
description = "Sidecar services for the OpenMobility® Manager (OMM)"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts",
    "mitel-ommclient2",
    "pyvoip>=1.6.8",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "python-dotenv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
mitel-ommclient2 = { path = "mitel_ommclient2", editable = true }

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.16",
]

[project.scripts]
dect-users = "omm_sidecars.dect_users:main"

[tool.pytest.ini_options]
timeout = 10

[tool.basedpyright]
typeCheckingMode = "strict"
stubPath = "typings"
exclude = ["**/tests/**", "**/.venv/**", "typings"]

[tool.ruff]
exclude = ["typings", "**/.venv/**"]
